# AIPrivateSearch Installer — Pinned Dependency Versions
#
# Single source of truth for the versions of third-party runtimes that the
# installer downloads/bundles. Edit values here; the build scripts source this
# file so there is no need to change versions in multiple places.
#
# This file is sourced by:
#   - build-prepare-resources.sh  (build time: downloads/bundles into the DMG)
#   - build-install-app.sh        (build time: bakes the value into the
#                                   generated end-user installer)
#
# Format: plain shell variable assignments. Keep the "v" prefix on Node.js
# versions — the download URL and tarball name are derived from it.

# Node.js — see https://nodejs.org/dist/ for available versions.
# Must satisfy package.json "engines.node" (currently >=18.0.0).
NODE_VERSION="v22.20.0"

# Ollama — GitHub release tag, see https://github.com/ollama/ollama/releases
# (Currently referenced directly in build-install-app.sh; defined here so it
#  can be centralized in future without another refactor.)
OLLAMA_VERSION="v0.30.8"
